<div
  class="chat-area"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <!-- Drag overlay -->
  <div class="drag-overlay" [class.active]="isDragOver">
    <div class="drag-content">
      <div class="drag-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <h3>Déposez votre document ici</h3>
      <p>PDF, DOCX, TXT — Max 50 MB</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-container" #messagesContainer>
    <div class="messages-inner">
      <div
        *ngFor="let msg of messages; trackBy: trackByMsgId"
        class="message-wrapper"
        [ngClass]="'message-' + msg.type"
      >
        <!-- Bot Avatar -->
        <div *ngIf="msg.type === 'bot'" class="message-avatar bot-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"/>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>

        <div class="message-bubble" [ngClass]="'bubble-' + msg.type">
          <div
            class="message-content"
            [innerHTML]="formatMessageContent(msg.content)"
          ></div>

          <!-- Compliance Score Badge -->
          <div *ngIf="msg.complianceReport" class="compliance-badge-inline">
            <div class="score-circle" [ngClass]="getScoreClass(msg.complianceReport.overallScore)">
              <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg"
                  d="M18 2.0845
                    a 15.9155 15.9155 0 0 1 0 31.831
                    a 15.9155 15.9155 0 0 1 0 -31.831"
                />
                <path class="circle"
                  [attr.stroke-dasharray]="msg.complianceReport.overallScore + ', 100'"
                  d="M18 2.0845
                    a 15.9155 15.9155 0 0 1 0 31.831
                    a 15.9155 15.9155 0 0 1 0 -31.831"
                />
              </svg>
              <span class="score-text">{{ msg.complianceReport.overallScore }}%</span>
            </div>
          </div>

          <div class="message-time">
            {{ getMessageTimeFormatted(msg.timestamp) }}
          </div>
        </div>

        <!-- User Avatar -->
        <div *ngIf="msg.type === 'user'" class="message-avatar user-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <!-- Typing indicator -->
      <div *ngIf="isUploading" class="message-wrapper message-bot">
        <div class="message-avatar bot-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"/>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          </svg>
        </div>
        <div class="message-bubble bubble-bot">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
<!-- Input Area -->
<div class="input-area">
  <div class="input-wrapper">
    <button class="btn-attach" (click)="triggerFileUpload()" title="Uploader un PDF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>

    <input type="file" #fileInput
      (change)="onFileSelected($event)"
      accept=".pdf,application/pdf"
      style="display: none"
    />

    <div class="textarea-wrapper">
      <textarea
        [(ngModel)]="userInput"
        (keypress)="onKeyPress($event)"
        placeholder="Glissez votre brevet PDF ici ou cliquez pour uploader..."
        rows="1"
        class="chat-input"
      ></textarea>
    </div>

    <button
      class="btn-send"
      (click)="sendMessage()"
      [disabled]="!userInput.trim() && !isUploading"
      [class.active]="userInput.trim()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>

    <button class="btn-upload-main" (click)="triggerFileUpload()" title="Analyser un brevet PDF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </button>
  </div>

  <p class="input-hint">
    📎 Glissez votre brevet PDF • L'analyse vérifie automatiquement les 3 normes de qualité
  </p>
</div>

  </div>
</div>
